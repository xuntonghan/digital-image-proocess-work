[experiment]
name = "sied_canon_00001_decoder_color_finetune"

[dataset]
width = 3840
height = 2160
black_level = 512
white_level = 16383
bayer_pattern = "RGGB"
patch_size = 512
augment = true
color_aware_probability = 0.7
color_aware_candidates = 6

[model]
in_channels = 4
out_channels = 3
base_channels = 32
depth = 4
normalization = "batch"
output_space = "rgb"
illumination_conditioning = true
hvi_density = 0.2
color_lut_refinement = true
color_lut_size = 17
color_lut_basis = 4

[training]
batch_size = 1
num_workers = 4
learning_rate = 0.00001
weight_decay = 0.000001
max_steps = 5000
validation_interval = 500
checkpoint_interval = 1000
gradient_accumulation = 4
ssim_weight = 0.15
chroma_weight = 0.6
hvi_weight = 0.5
histogram_weight = 0.1
edge_weight = 0.05
color_moment_weight = 0.25
hue_weight = 0.1
saturation_weight = 0.2
ema_decay = 0.99
scheduler = "cosine"
min_learning_rate = 0.000001
max_grad_norm = 0.5
seed = 20260930
amp = true
output_dir = "checkpoints/enhancement/canon_decoder_color"
