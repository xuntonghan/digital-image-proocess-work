[experiment]
name = "sied_sony_0001_raw2rgb"

[dataset]
width = 3840
height = 2160
black_level = 512
white_level = 16383
bayer_pattern = "RGGB"
patch_size = 256
augment = true

[model]
in_channels = 4
out_channels = 3
base_channels = 32
depth = 4
normalization = "batch"

[training]
batch_size = 4
num_workers = 4
learning_rate = 0.0001
weight_decay = 0.0001
max_steps = 50000
validation_interval = 1000
checkpoint_interval = 2000
gradient_accumulation = 1
ssim_weight = 0.2
chroma_weight = 1.0
seed = 20260930
amp = true
output_dir = "checkpoints/enhancement/sony"
